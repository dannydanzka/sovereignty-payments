name: publish

# Publishing happens ONLY here. A laptop publish bypasses the gates below and has, in sibling
# repos, shipped a build that never passed type-check.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com
          scope: '@dannydanzka'

      - run: yarn install --frozen-lockfile

      # The gate: nothing reaches the registry that has not type-checked, linted, tested and built.
      - run: yarn verify

      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
